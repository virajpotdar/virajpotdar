<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="490px" height="370px" viewBox="0 0 490 370" role="img" aria-label="Neofetch info card">
  <style>
    .bg { fill: #0d1117; }
    .card { fill: #01040a; stroke: #21262d; }
    .title { font-family: Inter,Segoe UI,Helvetica,Arial,sans-serif; fill: #58a6ff; font-size:20px; font-weight:700 }
    .label { font-family: Inter,Segoe UI,Helvetica,Arial,sans-serif; fill: #8b949e; font-size:12px }
    .value { font-family: Inter,Segoe UI,Helvetica,Arial,sans-serif; fill: #c9d1d9; font-size:13px }
  </style>
  <rect width="100%" height="100%" class="bg" />
  <g transform="translate(16,16)">
    <rect class="card" x="0" y="0" width="458" height="338" rx="8" ry="8" />
    <!-- Left: avatar box -->
    <rect x="18" y="18" width="150" height="150" rx="6" ry="6" fill="#161b22" stroke="#1f2933" />
    <text x="96" y="100" font-family="monospace" font-size="18" fill="#c9d1d9" text-anchor="middle">AVI</text>

    <!-- Right: info -->
    <text x="190" y="40" class="title">Viraj Vivek Potdar</text>
    <text x="190" y="64" class="label">Software Engineer · Open Source</text>

    <g transform="translate(190,90)">
      <text x="0" y="0" class="label">Location</text>
      <text x="0" y="18" class="value">Sangli </text>

      <text x="0" y="46" class="label">Languages</text>
      <text x="0" y="64" class="value">Python · JavaScript · Java </text>

      <text x="0" y="92" class="label">Work</text>
      <text x="0" y="110" class="value">Building developer tools &amp; automation</text>

      <text x="0" y="142" class="label">Contact 9764482435</text>
    </g>

    <!-- Footer stats -->
    <text x="18" y="200" class="label">OS</text>
    <text x="190" y="200" class="label">Uptime</text>
    <text x="250" y="200" class="value">5 days</text>

    <!-- small divider -->
    <line x1="18" y1="220" x2="440" y2="220" stroke="#161b22" stroke-width="1" />
    <text x="18" y="238" class="label">Updated</text>
    <text x="90" y="238" class="value">2026-07-25</text>
  </g>
</svg>
