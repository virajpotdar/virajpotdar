<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260" role="img" aria-label="Contribution heatmap for virajpotdar">
  <style>
    .bg { fill: #0d1117; }
    .label { font-family: Inter,Segoe UI,Helvetica,Arial,sans-serif; fill: #c9d1d9; font-size:14px }
    .legend-label { font-family: Inter,Segoe UI,Helvetica,Arial,sans-serif; fill: #8b949e; font-size:12px }
  </style>
  <rect width="100%" height="100%" class="bg" />
  <text x="430" y="20" class="label" text-anchor="middle">Contributions</text>

  <!-- Heatmap grid -->
  <g id="heatmap" transform="translate(20,30)">
    <!-- Generated grid: 28 weeks x 7 days -->
    <!-- Colors: none=#ebedf0, low=#9be9a8, medium=#40c463, high=#30a14e, very_high=#216e39 -->
